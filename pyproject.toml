[project]
name = "mrkarirbot"
version = "0.1.0"
description = "MrKarirBot AI Career Assistant Enterprise Phase 1 Telegram Bot backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.51",
  "alembic==1.18.5",
  "asyncpg==0.31.0",
  "python-telegram-bot==22.8",
  "redis==8.1.0",
  "slowapi==0.1.10",
  "openai==2.52.0",
  "python-multipart==0.0.32",
  "email-validator==2.3.0",
  "httpx[socks]==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.1"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*", "assets*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
