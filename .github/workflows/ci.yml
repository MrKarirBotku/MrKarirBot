name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip==26.1.2
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: pip install pytest==9.1.1 pytest-asyncio==1.4.0 ruff==0.16.1
      - run: ruff check .
      - run: python -m compileall app scripts tests alembic
      - name: Verify recovered Supabase migrations
        run: sha256sum --check supabase/migrations/manifest.sha256
      - run: pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag mrkarir-ai:ci .
