name: Deploy Cloudflare Edge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-deploy.yml"
      - "web/**"
      - "src/cloudflare-worker.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.cloudflare.json"

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare binding types
        run: npm run cf:types

      - name: Type-check Worker
        run: npx tsc --project tsconfig.cloudflare.json

      - name: Validate deployment bundle
        run: npm run cf:check

      - name: Remove only conflicting apex DNS records
        run: node scripts/reconcile_cloudflare_dns.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and static assets
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Inspect relevant Cloudflare DNS records
        run: node scripts/inspect_cloudflare_dns.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
